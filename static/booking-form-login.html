<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flowly – Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal: #3A9B8E;
      --teal-dark: #2B7A6E;
      --teal-light: #D4EFEB;
      --teal-pale: #EEF8F6;
      --sand: #F2E8D5;
      --sand-dark: #E4D4B8;
      --charcoal: #1E2A28;
      --charcoal-mid: #3D4D4A;
      --muted: #7A8C89;
      --white: #FDFCFB;
      --coral: #E07060;
      --border: #E4E7E6;
      --radius: 0.625rem;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background: radial-gradient(ellipse 100% 70% at 50% -10%, var(--teal-pale) 0%, var(--white) 65%);
      color: var(--charcoal);
    }

    /* ── Card ── */
    .card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 1.25rem;
      padding: 2.5rem 2.5rem 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.75rem;
      box-shadow:
        0 0 0 1px rgba(58,155,142,.12),
        0 4px 8px -2px rgba(30,42,40,.08),
        0 16px 40px -8px rgba(30,42,40,.1);
    }

    /* ── Logo ── */
    .logo-wrap { display: flex; flex-direction: column; gap: 0.25rem; }
    .logo {
      font-family: 'Fraunces', serif;
      font-size: 2.25rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
    }
    .logo .flow { color: var(--charcoal); }
    .logo .ly   { color: var(--teal); }
    .logo-sub   { font-size: 0.8125rem; color: var(--muted); }

    /* ── Divider ── */
    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 500;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── Buttons ── */
    .btn {
      width: 100%;
      padding: 0.75rem 1.25rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 150ms, border-color 150ms, box-shadow 150ms;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      border: 1.5px solid var(--border);
      background: #fff;
      color: var(--charcoal);
      font-family: inherit;
      letter-spacing: 0;
    }
    .btn:hover {
      background: var(--teal-pale);
      border-color: var(--teal-light);
    }
    .btn:active { opacity: 0.85; }

    .btn-primary {
      background: var(--teal);
      border-color: var(--teal);
      color: #fff;
      box-shadow: 0 2px 8px rgba(58,155,142,.25);
    }
    .btn-primary:hover {
      background: var(--teal-dark);
      border-color: var(--teal-dark);
    }

    .btn-group { display: flex; flex-direction: column; gap: 0.625rem; }

    /* ── Mobile input ── */
    .field { display: flex; flex-direction: column; gap: 0.375rem; }
    .field label { font-size: 0.75rem; font-weight: 500; color: var(--charcoal); }
    .input-wrap {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      transition: border-color 150ms;
    }
    .input-wrap:focus-within { border-color: var(--teal); }
    .input-prefix {
      display: flex;
      align-items: center;
      padding: 0 0.875rem;
      background: var(--teal-pale);
      color: var(--muted);
      font-size: 0.8125rem;
      border-right: 1.5px solid var(--border);
      white-space: nowrap;
    }
    .input-wrap input {
      flex: 1;
      border: none;
      outline: none;
      padding: 0.625rem 0.875rem;
      font-size: 0.875rem;
      color: var(--charcoal);
      background: transparent;
      font-family: inherit;
    }
    .input-wrap input::placeholder { color: #c4cbc9; }

    /* ── Mobile section ── */
    .mobile-section { display: flex; flex-direction: column; gap: 0.875rem; }

    /* ── Google icon ── */
    .google-icon { width: 1.125rem; height: 1.125rem; flex-shrink: 0; }

    /* ── OTP Dialog ── */
    .dialog-overlay {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(30,42,40,.45);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .dialog-overlay.open { display: flex; }
    .dialog-box {
      background: #fff;
      border-radius: 1.25rem;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      box-shadow: 0 4px 8px -2px rgba(30,42,40,.08), 0 20px 48px -8px rgba(30,42,40,.2);
    }
    .dialog-header { display: flex; flex-direction: column; gap: 0.25rem; }
    .dialog-title { font-size: 1rem; font-weight: 600; color: var(--charcoal); }
    .dialog-sub   { font-size: 0.75rem; color: var(--muted); }

    .otp-grid {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 0.5rem;
    }
    .otp-input {
      text-align: center;
      font-size: 1.375rem;
      font-weight: 700;
      padding: 0.75rem 0.25rem;
      border: 1.5px solid var(--border);
      border-radius: 0.75rem;
      outline: none;
      color: var(--charcoal);
      font-family: inherit;
      transition: border-color 150ms, background 150ms;
    }
    .otp-input:focus {
      border-color: var(--teal);
      background: var(--teal-pale);
    }

    .dialog-actions {
      display: flex;
      gap: 0.625rem;
    }
    .dialog-actions .btn-primary { flex: 1; }
    .btn-ghost {
      padding: 0.75rem 1rem;
      border-radius: 0.75rem;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: inherit;
      transition: background 150ms, color 150ms;
      white-space: nowrap;
    }
    .btn-ghost:hover { background: var(--teal-pale); color: var(--charcoal); }
  </style>
</head>
<body>

  <div class="card">
    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo"><span class="flow">Flow</span><span class="ly">ly</span></div>
      <p class="logo-sub">Book your next appointment</p>
    </div>

    <!-- Primary auth options -->
    <div class="btn-group">
      <button class="btn" onclick="window.location='booking-form-location.html'">
        Book as guest
      </button>
      <button class="btn" onclick="window.location='booking-form-location.html'">
        <svg class="google-icon" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
          <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
          <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
          <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
          <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
        </svg>
        Continue with Google
      </button>
    </div>

    <!-- Divider -->
    <div class="divider">or use your mobile number</div>

    <!-- Mobile login -->
    <div class="mobile-section">
      <div class="field">
        <label for="mobile">Mobile number</label>
        <div class="input-wrap">
          <span class="input-prefix">+64</span>
          <input id="mobile" type="tel" placeholder="21 123 4567" />
        </div>
      </div>
      <button class="btn btn-primary" onclick="document.getElementById('otp-dialog').classList.add('open')">
        Log In
      </button>
    </div>
  </div>

  <!-- OTP Dialog -->
  <div class="dialog-overlay" id="otp-dialog">
    <div class="dialog-box">
      <div class="dialog-header">
        <p class="dialog-title">Enter the OTP sent to your mobile</p>
        <p class="dialog-sub">Check your messages for a 6-digit code</p>
      </div>
      <div class="otp-grid">
        <input class="otp-input" type="text" maxlength="1" />
        <input class="otp-input" type="text" maxlength="1" />
        <input class="otp-input" type="text" maxlength="1" />
        <input class="otp-input" type="text" maxlength="1" />
        <input class="otp-input" type="text" maxlength="1" />
        <input class="otp-input" type="text" maxlength="1" />
      </div>
      <div class="dialog-actions">
        <button class="btn btn-primary" onclick="window.location='booking-form-location.html'">Authenticate</button>
        <button class="btn-ghost" onclick="document.getElementById('otp-dialog').classList.remove('open')">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // Auto-advance OTP inputs
    document.querySelectorAll('.otp-input').forEach((input, i, inputs) => {
      input.addEventListener('input', () => {
        if (input.value.length === 1 && i < inputs.length - 1) inputs[i + 1].focus();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && input.value === '' && i > 0) inputs[i - 1].focus();
      });
    });
  </script>
</body>
</html>
